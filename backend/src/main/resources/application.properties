spring.application.name=quiz-platform
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
